name: Validate library
on:
  push:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - run: python -m pip install '.[dev]'
      - run: ruff check . && ruff format --check .
      - run: mypy src/zentraly
      - run: pytest --cov=zentraly --cov-branch
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Test the built wheel without Home Assistant
        run: |
          python -m venv /tmp/zentraly-wheel
          /tmp/zentraly-wheel/bin/pip install dist/*.whl pytest pytest-asyncio
          /tmp/zentraly-wheel/bin/python -c "import importlib.util; assert importlib.util.find_spec('homeassistant') is None"
          /tmp/zentraly-wheel/bin/pytest
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
