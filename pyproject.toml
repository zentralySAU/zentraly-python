[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "zentraly"
version = "0.1.0"
description = "Asynchronous client for the Zentraly device protocol"
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = ["aiohttp>=3.13,<4"]
classifiers = ["Programming Language :: Python :: 3", "Programming Language :: Python :: 3.14", "Framework :: AsyncIO"]

[project.urls]
Repository = "https://github.com/zentralySAU/zentraly-python"
Issues = "https://github.com/zentralySAU/zentraly-python/issues"

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6"]
dev = ["ruff", "mypy", "build", "twine", "pytest>=8", "pytest-asyncio>=1", "pytest-cov>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/zentraly"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
warn_unused_ignores = true
